<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revealix · The Lost Lexicon — Legal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f1e8;
            color: #2b1f10;
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            text-align: center;
            background: #fffaf0;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            margin: 20px;
            box-shadow: 0 4px 28px rgba(75, 45, 15, 0.12);
            border: 1px solid rgba(184, 122, 30, 0.18);
        }
        .card img {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 20px;
            box-shadow: 0 8px 28px rgba(122, 70, 18, 0.35);
        }
        .card h1 {
            font-size: 1.55em;
            font-weight: 800;
            margin-bottom: 4px;
            color: #2b1f10;
            letter-spacing: -0.01em;
        }
        .card .subtitle {
            color: #b87a1e;
            font-size: 0.95em;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .card p {
            color: #7a5d3a;
            font-size: 0.93em;
            margin-bottom: 28px;
        }
        .links a {
            display: block;
            padding: 14px 24px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #B5780E 0%, #E89B3A 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(184, 122, 30, 0.30);
        }
        .links a:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 6px 20px rgba(184, 122, 30, 0.45);
        }
        .links a:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="card">
        <img src="images/appicon.png" alt="Revealix">
        <h1>Revealix</h1>
        <div class="subtitle">· The Lost Lexicon ·</div>
        <p>Reveal the words. Discover the world.</p>
        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Use</a>
        </div>
    </div>
</body>
</html>
